  <link rel="stylesheet" href="style.css">

<body data-theme="dark">

<!-- Pre-paint: apply persisted theme before the modules hydrate to prevent a flash. -->
<script>
  (function () {
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    try {
      var raw = localStorage.getItem("aravind_portfolio_v1");
      var theme = "dark";
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && (parsed.theme === "dark" || parsed.theme === "light")) {
          theme = parsed.theme;
        }
      }
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>

<!-- Portfolio mode renders here (replaced by js/mode/portfolio.js on DOMContentLoaded) -->
<div id="portfolio-root"></div>

<!-- Terminal mode mounts here (js/mode/terminal.js injects its own DOM on ?mode=terminal) -->

<script type="module" src="js/main.js"></script>
</body>
</html>
